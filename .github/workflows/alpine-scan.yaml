name: alpine Runtime Scan

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            curl \
            libguestfs-tools \
            guestmount \
            netcat-openbsd \
            ca-certificates 

      - name: Download Alpine
        run: |
          curl -L --retry 5 -o alpine.qcow2 \
            https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/cloud/generic_alpine-3.23.4-x86_64-bios-cloudinit-metal-r0.qcow2

      - name: Mount qcow2 image
        run: |
          sudo mkdir -p /mnt/alpine-root
          sudo guestmount -a alpine.qcow2 -i --ro /mnt/alpine-root

      - name: Run Trivy scan (offline rootfs)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh

          sudo ./bin/trivy rootfs /mnt/alpine-root \
            --scanners vuln,misconfig \
            -f sarif \
            -o report.sarif

      - name: Unmount qcow2
        if: always()
        run: |
          sudo guestunmount /mnt/alpine-root || true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: report.sarif
